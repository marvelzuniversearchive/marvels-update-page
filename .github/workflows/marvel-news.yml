name: Refresh Marvel live news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marvel-live-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Collect Marvel headlines
        run: python scripts/collect_marvel_news.py
      - name: Publish feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-feed.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Refresh Marvel live news feed"
            git push
          fi
